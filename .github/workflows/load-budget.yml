# load-budget in CI: PHILOSOPHY P7, the always-loaded budget and the no-second-copy rule.
#
# The steps live in guards/ci/load-budget/action.yml, one copy for the whole fleet.
name: load-budget

on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./guards/ci/load-budget
