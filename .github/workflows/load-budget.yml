# load-budget in CI: PHILOSOPHY P7, the always-loaded budget and the no-second-copy rule.
#
# The steps live in style/ci/load-budget/action.yml, one copy for the whole fleet. This gate is
# style, not security, which is why it comes from a different submodule than the scanner:
# nothing here keeps an identifier out of a public history.
name: load-budget

on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./style/ci/load-budget
