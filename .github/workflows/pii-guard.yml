# pii_guard in CI -- the authority.
#
# The local hooks are a fast fail, not a guarantee. On 2026-07-13 a pre-commit hook printed its
# findings and let the commit through anyway, because the caller had piped `git commit` into `head`
# and the severed pipe destroyed the guard's exit status. A local hook can also be skipped with
# --no-verify, is not installed on a fresh clone until someone opts in, and does not exist at all
# for an outside contributor.
#
# This runs on GitHub, on every push and every PR, and it cannot be reached by any of that.
#
# The steps live in the guards submodule (guards/ci/pii-guard/action.yml) so there is ONE copy of
# them across the fleet rather than one per repo, which had already begun to drift. This file is
# only the wiring; the action carries the reasoning for each step.
#
# It runs WITHOUT the operator's private denylist (that file never leaves their machine). That is
# the point of the allowlist design: the structural checks need no private data, so they work here.
name: pii-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0        # the history scan is the point; a shallow clone would see nothing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./guards/ci/pii-guard
