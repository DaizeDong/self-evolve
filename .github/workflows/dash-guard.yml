# dash-guard in CI: the house rule that published prose carries no en/em dash (the ASCII hyphen is
# code syntax and is left alone). Style, not security, so it scans the current tree only.
#
# The steps live in guards/ci/dash-guard/action.yml, one copy for the whole fleet.
name: dash-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./guards/ci/dash-guard
